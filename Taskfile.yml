version: '3'

vars:
  APP_NAME: "gul"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Avoid treating Go snippets shipped inside frontend/node_modules as part of
  # this module after npm install.
  GO_PACKAGES: '. ./cmd/... ./internal/... ./services/...'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  lint:
    summary: Runs gofmt check, go vet, golangci-lint and frontend eslint
    cmds:
      - >-
        test -z "$(find . -type f -name '*.go'
        -not -path './.*'
        -not -path './bin/*'
        -not -path './third_party/*'
        -not -path './frontend/*'
        -exec gofmt -l {} +)"
      - bash scripts/check-native-headers.sh
      - go vet {{.GO_PACKAGES}}
      - golangci-lint run {{.GO_PACKAGES}}
      - cd frontend && npm run lint

  test:
    summary: Runs Go tests with the race detector (device/live tests excluded)
    cmds:
      - go test -race {{.GO_PACKAGES}}

  test:live:
    summary: Runs tests that need the local murmur stand (task murmur:up first)
    cmds:
      - go test -race -tags live {{.GO_PACKAGES}}

  murmur:up:
    summary: Starts the development Mumble server (murmur) in Docker
    cmds:
      - docker compose -f deploy/murmur/docker-compose.yml up -d

  murmur:down:
    summary: Stops the development Mumble server (murmur)
    cmds:
      - docker compose -f deploy/murmur/docker-compose.yml down

  murmur:logs:
    summary: Shows the last 50 log lines of the development Mumble server
    cmds:
      - docker compose -f deploy/murmur/docker-compose.yml logs --tail=50
