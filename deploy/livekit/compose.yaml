name: gul-livekit

services:
  livekit:
    image: livekit/livekit-server:v1.13.8@sha256:ad961c9b4b064298cc08d618d772671f7c783e036001388079fa813929cc357e
    restart: unless-stopped
    # Native host routing keeps TURN relay paths on this node. The firewall
    # service must protect the plaintext signalling/TURN ports before startup.
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      GOMEMLIMIT: 400MiB
    mem_limit: 512m
    pids_limit: 256
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./private/livekit.yaml:/etc/livekit.yaml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
