# Merge with deploy/hysteria/compose.ip.yaml. Paths are relative to that base.
# Remove masquerade.listenHTTPS from Hysteria's config before starting Xray.
services:
  reality:
    image: ${GUL_REALITY_IMAGE:?Set the verified local Xray image digest}
    pull_policy: never
    restart: unless-stopped
    network_mode: service:mumble
    depends_on:
      mumble:
        condition: service_started
        restart: true
    # Root can read the operator-owned 0600 config; capabilities and writable
    # storage remain restricted. The process cannot access host namespaces.
    user: "0:0"
    environment:
      GOMEMLIMIT: "96MiB"
    mem_limit: 128m
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./private/reality/server.json:/etc/xray/server.json:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
