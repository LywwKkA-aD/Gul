# Go server lint configuration. Run golangci-lint from server/.
# Formatting is checked separately with gofmt.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Unchecked errors in test helpers are noise, not defects.
      - path: _test\.go
        linters:
          - errcheck

issues:
  # CI should surface every finding, not the first 50.
  max-issues-per-linter: 0
  max-same-issues: 0
